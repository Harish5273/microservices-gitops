apiVersion: v1
kind: Secret
metadata:
  name: codecommit-gitops-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://git-codecommit.us-east-1.amazonaws.com/v1/repos/microservices-gitops
  # Generated from AWS IAM -> Security credentials -> "HTTPS Git credentials for AWS CodeCommit"
  username: "YOUR_IAM_CODECOMMIT_GIT_USERNAME"
  password: "YOUR_IAM_CODECOMMIT_GIT_PASSWORD"
